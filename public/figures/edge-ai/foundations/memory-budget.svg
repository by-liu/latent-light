<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" role="img" aria-labelledby="title desc"><title id="title">Weights stay fixed while cache follows context and KV heads</title><desc id="desc">Calculated hypothetical decoder: weights 1.5 billion bytes; cache 448, 896 or 112 MiB gives total 1.83, 2.27 or 1.51 GiB. Payload only, not peak process memory.</desc><defs><pattern id="cache" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#3f8a86"/><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#9bd4c9" stroke-width="1.5"/></pattern></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172b46}.title{font-size:28px;font-weight:700}.label{font-size:20px;font-weight:600}.detail,.tick{font-size:17px;fill:#56657b}.sum{font-size:21px;font-weight:700}.note{font-size:18px;fill:#56657b}</style><rect width="1000" height="466" rx="16" fill="#fff"/><text x="36" y="44" class="title">Weights stay fixed. Context changes the budget.</text><rect x="36" y="69" width="19" height="19" rx="3" fill="#4c66b4"/><text x="67" y="85" class="detail">Weights: 1.5 GB ≈ 1.40 GiB</text><rect x="378" y="69" width="19" height="19" fill="url(#cache)"/><text x="409" y="85" class="detail">KV cache: 16 bit values</text><line x1="360" y1="122" x2="360" y2="349" stroke="#dfe4ed" stroke-dasharray="3 5"/><text x="360" y="380" class="tick" text-anchor="middle">0</text><line x1="464" y1="122" x2="464" y2="349" stroke="#dfe4ed" stroke-dasharray="3 5"/><text x="464" y="380" class="tick" text-anchor="middle">0.5</text><line x1="568" y1="122" x2="568" y2="349" stroke="#dfe4ed" stroke-dasharray="3 5"/><text x="568" y="380" class="tick" text-anchor="middle">1</text><line x1="672" y1="122" x2="672" y2="349" stroke="#dfe4ed" stroke-dasharray="3 5"/><text x="672" y="380" class="tick" text-anchor="middle">1.5</text><line x1="776" y1="122" x2="776" y2="349" stroke="#dfe4ed" stroke-dasharray="3 5"/><text x="776" y="380" class="tick" text-anchor="middle">2</text><line x1="880" y1="122" x2="880" y2="349" stroke="#dfe4ed" stroke-dasharray="3 5"/><text x="880" y="380" class="tick" text-anchor="middle">2.5</text><text x="36" y="150" class="label">4,096 tokens · 8 KV heads</text><text x="36" y="176" class="detail">KV cache: 448 MiB</text><rect x="360" y="131" width="290.573" height="40" rx="5" fill="#4c66b4"/><rect x="650.573" y="131" width="91.000" height="40" fill="url(#cache)"/><text x="753.573" y="157" class="sum">1.83 GiB</text><text x="36" y="237" class="label">8,192 tokens · 8 KV heads</text><text x="36" y="263" class="detail">KV cache: 896 MiB</text><rect x="360" y="218" width="290.573" height="40" rx="5" fill="#4c66b4"/><rect x="650.573" y="218" width="182.000" height="40" fill="url(#cache)"/><text x="844.573" y="244" class="sum">2.27 GiB</text><text x="36" y="324" class="label">4,096 tokens · 2 KV heads</text><text x="36" y="350" class="detail">KV cache: 112 MiB</text><rect x="360" y="305" width="290.573" height="40" rx="5" fill="#4c66b4"/><rect x="650.573" y="305" width="22.750" height="40" fill="url(#cache)"/><text x="685.323" y="331" class="sum">1.51 GiB</text><text x="620" y="411" text-anchor="middle" class="detail">Ideal weights + cache (GiB)</text><text x="36" y="448" class="note">Hypothetical 3B decoder · Excludes scales, workspace, live tensors and application memory</text></svg>
