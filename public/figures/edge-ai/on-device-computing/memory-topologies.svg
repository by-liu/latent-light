<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Follow the memory, not just the chip</title><desc id="desc">Three representative arrangements: host CPU plus a discrete GPU with dedicated HBM or GDDR; an integrated system sharing DRAM; and a microcontroller with a small SRAM working set and external storage. These are examples, not a universal cloud/device boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#697e98"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172b46}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px}.note{font-size:17px;fill:#52647b}.eyebrow{font-size:16px;font-weight:700;letter-spacing:1px;fill:#52647b}</style><rect width="1000" height="640" rx="16" fill="#fff"/><text x="32" y="46" class="title">The same model meets different memory roads.</text><rect x="28" y="76" width="452" height="350" rx="12" fill="#f5f7fb" stroke="#b7c5d6" stroke-width="1.6"/><rect x="500" y="76" width="472" height="350" rx="12" fill="#f5f7fb" stroke="#b7c5d6" stroke-width="1.6"/><text x="48" y="110" class="eyebrow">DISCRETE ACCELERATOR</text><text x="48" y="142" class="label">Cloud server or local GPU workstation</text><rect x="48" y="166" width="185" height="72" rx="12" fill="#edf2fc" stroke="#8da7d3" stroke-width="1.6"/><text x="64" y="196" class="label">Host CPU</text><text x="64" y="222" class="body">System DRAM</text><rect x="265" y="166" width="193" height="72" rx="12" fill="#f0ebf9" stroke="#a792c5" stroke-width="1.6"/><text x="281" y="196" class="label">GPU</text><text x="281" y="222" class="body">Tensor / SIMD work</text><path d="M234 200H261" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><text x="88" y="274" class="note">PCIe or another host interconnect</text><rect x="265" y="300" width="193" height="69" rx="12" fill="#f0ebf9" stroke="#a792c5" stroke-width="1.6"/><text x="281" y="329" class="label">Dedicated VRAM</text><text x="281" y="352" class="body">HBM or GDDR</text><path d="M361 239V295" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><text x="48" y="401" class="note">Host RAM is not automatically fast GPU RAM.</text><text x="520" y="110" class="eyebrow">INTEGRATED SYSTEM</text><text x="520" y="142" class="label">Many phones, PCs and robot modules</text><rect x="520" y="166" width="133" height="78" rx="12" fill="#edf2fc" stroke="#8da7d3" stroke-width="1.6"/><text x="555" y="210" class="label">CPU</text><rect x="667" y="166" width="133" height="78" rx="12" fill="#f0ebf9" stroke="#a792c5" stroke-width="1.6"/><text x="702" y="210" class="label">GPU</text><rect x="814" y="166" width="136" height="78" rx="12" fill="#e8f5f0" stroke="#78aaa2" stroke-width="1.6"/><text x="838" y="198" class="label">NPU /</text><text x="838" y="224" class="body">engines</text><path d="M586 245V284" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M734 245V284" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M882 245V284" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="520" y="292" width="430" height="77" rx="12" fill="#e8f5f0" stroke="#78aaa2" stroke-width="1.6"/><text x="538" y="323" class="label">Shared DRAM pool + memory fabric</text><text x="538" y="350" class="body">Often LPDDR · device and runtime specific</text><text x="520" y="401" class="note">Shared capacity; bandwidth and access still matter.</text><rect x="28" y="447" width="944" height="165" rx="12" fill="#fffbf3" stroke="#c4ad7c" stroke-width="1.6"/><text x="48" y="480" class="eyebrow">MICROCONTROLLER / TINY ENDPOINT</text><rect x="48" y="494" width="207" height="70" rx="12" fill="#fff4df" stroke="#c4ad7c" stroke-width="1.6"/><text x="65" y="521" class="body">Flash / storage</text><text x="65" y="548" class="note">Weights and firmware</text><rect x="356" y="494" width="263" height="70" rx="12" fill="#fff4df" stroke="#c4ad7c" stroke-width="1.6"/><text x="373" y="521" class="label">Small SRAM</text><text x="373" y="548" class="note">Inputs, live tensors and scratch</text><rect x="723" y="494" width="225" height="70" rx="12" fill="#fff4df" stroke="#c4ad7c" stroke-width="1.6"/><text x="741" y="521" class="note">CPU / DSP / optional NPU</text><text x="741" y="548" class="note">Compiled task execution</text><path d="M257 529H351" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M622 529H718" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><text x="48" y="595" class="note">Illustrative topologies. Coherent cloud systems and discrete device GPUs are important exceptions.</text></svg>
