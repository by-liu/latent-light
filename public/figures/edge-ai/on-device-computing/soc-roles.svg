<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">A device is a team of processors</title><desc id="desc">An illustrative SoC includes CPU control, GPU parallel compute, NPU tensor execution, ISP camera processing and DSP audio/sensor processing. They connect through a shared memory fabric; a sensor hub can trigger heavier work. The runtime decides which supported graph regions use each engine.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#697e98"/></marker></defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172b46}.title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px}.note{font-size:17px;fill:#52647b}.eyebrow{font-size:16px;font-weight:700;letter-spacing:1px;fill:#52647b}</style><rect width="1000" height="650" rx="16" fill="#fff"/><text x="32" y="46" class="title">One device. Several kinds of work.</text><text x="34" y="82" class="note">Illustrative roles, not a vendor floorplan or fixed assignment</text><rect x="230" y="105" width="742" height="494" rx="12" fill="#f5f7fb" stroke="#b7c5d6" stroke-width="1.6"/><text x="252" y="140" class="eyebrow">SYSTEM ON CHIP / PACKAGE</text><rect x="254" y="161" width="215" height="119" rx="12" fill="#edf2fc" stroke="#8da7d3" stroke-width="1.6"/><text x="272" y="191" class="label">CPU</text><text x="272" y="220" class="body">Control and scheduling</text><text x="272" y="246" class="note">Parsing · tools · fallback</text><rect x="487" y="161" width="215" height="119" rx="12" fill="#f0ebf9" stroke="#a792c5" stroke-width="1.6"/><text x="505" y="191" class="label">GPU</text><text x="505" y="220" class="body">Parallel tensor work</text><text x="505" y="246" class="note">Graphics + matrix units</text><rect x="720" y="161" width="228" height="119" rx="12" fill="#e8f5f0" stroke="#78aaa2" stroke-width="1.6"/><text x="738" y="191" class="label">NPU</text><text x="738" y="220" class="body">Compiled neural graphs</text><text x="738" y="246" class="note">Precision / operator limits</text><rect x="254" y="346" width="448" height="107" rx="12" fill="#fff4df" stroke="#c4ad7c" stroke-width="1.6"/><text x="274" y="377" class="label">ISP + DSP + media engines</text><text x="274" y="406" class="body">Condition pixels, audio and video efficiently</text><text x="274" y="432" class="note">Not interchangeable with a language model</text><rect x="720" y="346" width="228" height="107" rx="12" fill="#edf2fc" stroke="#8da7d3" stroke-width="1.6"/><text x="739" y="377" class="label">Sensor hub</text><text x="739" y="406" class="body">Small ongoing signals</text><text x="739" y="432" class="note">Trigger optional work</text><rect x="254" y="515" width="694" height="65" rx="12" fill="#f5f7fb" stroke="#b7c5d6" stroke-width="1.6"/><text x="276" y="542" class="label">Memory fabric + caches + DRAM interfaces</text><text x="276" y="566" class="note">Weights, cache, live tensors, camera buffers and the rest of the app</text><path d="M361 281V322H707V510" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M594 281V320H707" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M834 281V326H707" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M478 454V510" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M834 454V510" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="28" y="164" width="172" height="74" rx="12" fill="#fff4df" stroke="#c4ad7c" stroke-width="1.6"/><text x="46" y="194" class="label">Camera pixels</text><text x="46" y="221" class="note">Captured pixels</text><rect x="28" y="263" width="172" height="74" rx="12" fill="#fff4df" stroke="#c4ad7c" stroke-width="1.6"/><text x="46" y="294" class="label">Mic / sensors</text><text x="46" y="319" class="note">Audio · timing</text><path d="M201 201H214V378H248" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M201 300H222V418H248" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="28" y="492" width="172" height="86" rx="12" fill="#edf2fc" stroke="#8da7d3" stroke-width="1.6"/><text x="46" y="525" class="label">Storage + I/O</text><text x="46" y="554" class="note">Models and results</text><path d="M201 546H248" fill="none" stroke="#697e98" stroke-width="2.3" marker-end="url(#arrow)"/><text x="32" y="630" class="note">Compute, memory and heat are shared budgets. Physical blocks do not guarantee application access.</text></svg>
