<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="515" viewBox="0 0 1000 515" role="img" aria-labelledby="title desc"><title id="title">Gemma4: family input interfaces and shared decoder work</title><desc id="desc">31B and26B expert models have vision encoders. E-series have smaller vision/audio encoders plus per-layer embeddings. Unified12B linearly projects raw image and audio chunks. Optional drafter reads main model state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#486b83"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203542}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.note{font-size:17px;fill:#46616f}.box{fill:#eef4f7;stroke:#9fb5c2;stroke-width:1.5}.accent{fill:#e2edf9;stroke:#688dae;stroke-width:1.7}.purple{fill:#efeafa;stroke:#a995c2;stroke-width:1.5}.line{fill:none;stroke:#486b83;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style><rect width="100%" height="100%" rx="18" fill="#fcfcf9"/><text x="35" y="43" class="title">Gemma 4: choose the interface, then the decoder</text><text x="35" y="77" class="note">Family schematic · text embeddings join each decoder directly</text><rect x="30" y="115" width="220" height="65" rx="10" class="box"/><text x="140" y="142" text-anchor="middle" class="label">Images</text><text x="140" y="166" text-anchor="middle" class="small">variable aspect ratio</text><rect x="295" y="115" width="255" height="65" rx="10" class="accent"/><text x="422.5" y="142" text-anchor="middle" class="label">550M vision encoder</text><text x="422.5" y="166" text-anchor="middle" class="small">16px patches → pool</text><rect x="595" y="115" width="350" height="65" rx="10" class="box"/><text x="770" y="142" text-anchor="middle" class="label">31B dense / 26B-A4B MoE</text><text x="770" y="166" text-anchor="middle" class="small">larger multimodal variants</text><path d="M250 147H295" class="line "/><path d="M550 147H595" class="line "/><rect x="30" y="235" width="220" height="65" rx="10" class="box"/><text x="140" y="262" text-anchor="middle" class="label">Images + audio</text><text x="140" y="286" text-anchor="middle" class="small">E2B / E4B</text><rect x="295" y="235" width="255" height="65" rx="10" class="accent"/><text x="422.5" y="262" text-anchor="middle" class="label">Small modality encoders</text><text x="422.5" y="286" text-anchor="middle" class="small">vision 150M · audio 305M</text><rect x="595" y="235" width="350" height="65" rx="10" class="box"/><text x="770" y="262" text-anchor="middle" class="label">E-series decoder + PLE</text><text x="770" y="286" text-anchor="middle" class="small">effective count ≠ total weights</text><path d="M250 267H295" class="line "/><path d="M550 267H595" class="line "/><rect x="30" y="355" width="220" height="65" rx="10" class="box"/><text x="140" y="382" text-anchor="middle" class="label">Raw pixels + waveform</text><text x="140" y="406" text-anchor="middle" class="small">48px image / 40ms audio</text><rect x="295" y="355" width="255" height="65" rx="10" class="purple"/><text x="422.5" y="382" text-anchor="middle" class="label">Linear projections</text><text x="422.5" y="406" text-anchor="middle" class="small">no separate encoder</text><rect x="595" y="355" width="350" height="65" rx="10" class="box"/><text x="770" y="382" text-anchor="middle" class="label">Unified 12B decoder</text><text x="770" y="406" text-anchor="middle" class="small">perception learned in main stack</text><path d="M250 387H295" class="line "/><path d="M550 387H595" class="line "/><path d="M30 446H965" stroke="#c7d1d4"/><text x="35" y="476" class="small">All output text · optional MTP head reads target activations + KV</text></svg>
