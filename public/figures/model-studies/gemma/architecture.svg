<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">Original Gemma: residual stream and attention state</title><desc id="desc">Two pre-normalized residual updates preserve a3072-wide stream. Sixteen query/KV heads each have256 dimensions in7B;2B shares one KV head across eight queries.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#486b83"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203542}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.note{font-size:17px;fill:#46616f}.box{fill:#eef4f7;stroke:#9fb5c2;stroke-width:1.5}.accent{fill:#e2edf9;stroke:#688dae;stroke-width:1.7}.purple{fill:#efeafa;stroke:#a995c2;stroke-width:1.5}.line{fill:none;stroke:#486b83;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style><rect width="100%" height="100%" rx="18" fill="#fcfcf9"/><text x="35" y="43" class="title">Original Gemma: follow the residual stream</text><text x="35" y="75" class="note">7B reference configuration · one block shown, repeated 28 times</text><rect x="30" y="128" width="150" height="65" rx="10" class="box"/><text x="105" y="155" text-anchor="middle" class="label">Input x</text><text x="105" y="179" text-anchor="middle" class="small">width 3,072</text><rect x="220" y="128" width="140" height="65" rx="10" class="box"/><text x="290" y="155" text-anchor="middle" class="label">RMSNorm</text><text x="290" y="179" text-anchor="middle" class="small">pre-attention</text><rect x="400" y="128" width="200" height="65" rx="10" class="accent"/><text x="500" y="155" text-anchor="middle" class="label">Causal attention</text><text x="500" y="179" text-anchor="middle" class="small">16 heads × 256</text><rect x="640" y="128" width="90" height="65" rx="10" class="box"/><text x="685" y="155" text-anchor="middle" class="label">+</text><text x="685" y="179" text-anchor="middle" class="small">residual</text><rect x="770" y="128" width="190" height="65" rx="10" class="box"/><text x="865" y="155" text-anchor="middle" class="label">RMSNorm</text><text x="865" y="179" text-anchor="middle" class="small">pre-FFN</text><path d="M180 160H220" class="line "/><path d="M360 160H400" class="line "/><path d="M600 160H640" class="line "/><path d="M730 160H770" class="line "/><path d="M105 128V103H685V128" class="line dashed"/><rect x="660" y="246" width="300" height="72" rx="10" class="purple"/><text x="810" y="273" text-anchor="middle" class="label">GELU gate ⊙ value</text><text x="810" y="297" text-anchor="middle" class="small">24,576 per expanded branch</text><rect x="510" y="246" width="110" height="72" rx="10" class="box"/><text x="565" y="273" text-anchor="middle" class="label">Down</text><text x="565" y="297" text-anchor="middle" class="small">to 3,072</text><rect x="340" y="246" width="125" height="72" rx="10" class="box"/><text x="402.5" y="273" text-anchor="middle" class="label">+</text><text x="402.5" y="297" text-anchor="middle" class="small">residual</text><rect x="30" y="246" width="265" height="72" rx="10" class="box"/><text x="162.5" y="273" text-anchor="middle" class="label">Output x′</text><text x="162.5" y="297" text-anchor="middle" class="small">width 3,072</text><path d="M865 193V246" class="line "/><path d="M660 281H620" class="line "/><path d="M510 281H465" class="line "/><path d="M340 281H295" class="line "/><path d="M745 160V223H402V246" class="line dashed"/><path d="M30 347H965" stroke="#c7d1d4"/><text x="35" y="379" class="label">Query heads ≠ stored KV heads</text><text x="35" y="412" class="small">7B: 16 Q heads → 16 KV heads (MHA)</text><text x="510" y="412" class="small">2B: 8 Q heads → 1 shared KV head (MQA)</text></svg>
