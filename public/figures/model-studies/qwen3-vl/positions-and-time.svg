<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc"><title id="title">Qwen3-VL: three axes, two kinds of time signal</title><desc id="desc">A conceptual old MRoPE layout groups temporal, height and width axes in separate frequency bands. In the selected Qwen3-VL configuration, 64 frequency slots assign H to 1,4 through58 and W to2,5 through59; T uses all remaining slots, yielding24,20,20. Temporal groups also have timestamp text in the language sequence. These timestamps represent elapsed seconds, not large absolute-time rotary position IDs. The schematic compares allocation principles, not equal-sized released model heads.</desc><style>text{font-family:Arial,sans-serif;fill:#213047} .title{font-size:29px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.muted{fill:#55677d}.box{fill:#f2f6fb;stroke:#c4d1e1;stroke-width:1.5}.vision{fill:#eef4ff;stroke:#6a8ce2;stroke-width:1.5}.time{fill:#fff3e9;stroke:#d59360;stroke-width:1.5}.depth{fill:#f3efff;stroke:#9780ce;stroke-width:1.5}.line{fill:none;stroke:#536880;stroke-width:2.3;marker-end:url(#arrow)}.side{fill:none;stroke:#8a6ac2;stroke-width:2.5;stroke-dasharray:7 4;marker-end:url(#side-arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#536880"/></marker><marker id="side-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a6ac2"/></marker></defs><rect width="1120" height="600" rx="16" fill="#fff"/>
<text class="title" x="36" y="52">Geometry rotates features. Timestamp text tells time.</text>
<text class="body muted" x="36" y="86">Two signals that solve different problems</text>
<text class="label" x="36" y="139">Grouped axis bands</text><text class="small muted" x="470" y="139">Conceptual older M-RoPE allocation, not checkpoint dimensions</text>
<rect class="time" x="130" y="156" width="277" height="45" rx="6"/><rect class="vision" x="413" y="156" width="277" height="45" rx="6"/><rect class="depth" x="696" y="156" width="277" height="45" rx="6"/>
<text class="body" x="170" y="185">Temporal frequencies</text><text class="body" x="456" y="185">Height frequencies</text><text class="body" x="744" y="185">Width frequencies</text>
<text class="label" x="36" y="246">Interleaved frequencies</text><text class="small muted" x="470" y="246">Selected 8B: T = 24 · H = 20 · W = 20 slots</text><rect x="138" y="266" width="61" height="46" rx="5" fill="#fff0e3" stroke="#9d591b"/><text x="168.5" y="297" text-anchor="middle" class="label">T</text><rect x="207" y="266" width="61" height="46" rx="5" fill="#e5efff" stroke="#2d5d9f"/><text x="237.5" y="297" text-anchor="middle" class="label">H</text><rect x="276" y="266" width="61" height="46" rx="5" fill="#ede7ff" stroke="#69509a"/><text x="306.5" y="297" text-anchor="middle" class="label">W</text><rect x="345" y="266" width="61" height="46" rx="5" fill="#fff0e3" stroke="#9d591b"/><text x="375.5" y="297" text-anchor="middle" class="label">T</text><rect x="414" y="266" width="61" height="46" rx="5" fill="#e5efff" stroke="#2d5d9f"/><text x="444.5" y="297" text-anchor="middle" class="label">H</text><rect x="483" y="266" width="61" height="46" rx="5" fill="#ede7ff" stroke="#69509a"/><text x="513.5" y="297" text-anchor="middle" class="label">W</text><text class="label" x="613" y="295">…</text><rect class="time" x="738" y="266" width="51" height="46" rx="5"/><text x="763.5" y="297" text-anchor="middle" class="label">T</text><rect class="time" x="796" y="266" width="51" height="46" rx="5"/><text x="821.5" y="297" text-anchor="middle" class="label">T</text><rect class="time" x="854" y="266" width="51" height="46" rx="5"/><text x="879.5" y="297" text-anchor="middle" class="label">T</text><rect class="time" x="912" y="266" width="51" height="46" rx="5"/><text x="937.5" y="297" text-anchor="middle" class="label">T</text><text class="small muted" x="130" y="340">Higher rotary frequency</text><text class="small muted" x="802" y="340">Lower frequency</text><path class="line" d="M357 334H789"/>
<text class="small" x="36" y="379">First 60 slots: T/H/W × 20. Final four: T. Slots shown schematically, not at equal scale.</text>
<path d="M36 403H1084" stroke="#d7e0eb"/>
<text class="label" x="36" y="442">Video language sequence</text>
<rect class="box" x="36" y="466" width="154" height="50" rx="7"/><text class="body" x="62" y="497">Prompt text</text>
<path class="line" d="M190 491H220"/><rect class="time" x="225" y="466" width="205" height="50" rx="7"/><text class="body" x="243" y="497">Timestamp string</text>
<path class="line" d="M430 491H460"/><rect class="vision" x="465" y="466" width="218" height="50" rx="7"/><text class="body" x="486" y="497">Visual tube tokens</text>
<path class="line" d="M683 491H713"/><rect class="time" x="718" y="466" width="205" height="50" rx="7"/><text class="body" x="736" y="497">Next timestamp</text><text class="label" x="954" y="497">→ …</text>
<text class="small muted" x="36" y="553">A timestamp describes elapsed time; rotary coordinates locate tokens. Boundary markers omitted here.</text></svg>
