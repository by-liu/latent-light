<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">Gemma2: capped logits and residual paths</title><desc id="desc">Each attention/FFN sublayer has input and output normalization. Score scaling then soft cap then mask then softmax. Alternating local/global context.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#486b83"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#203542}.title{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.note{font-size:17px;fill:#46616f}.box{fill:#eef4f7;stroke:#9fb5c2;stroke-width:1.5}.accent{fill:#e2edf9;stroke:#688dae;stroke-width:1.7}.purple{fill:#efeafa;stroke:#a995c2;stroke-width:1.5}.line{fill:none;stroke:#486b83;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}</style><rect width="100%" height="100%" rx="18" fill="#fcfcf9"/><text x="35" y="43" class="title">Gemma 2: three separate contracts</text><text x="35" y="77" class="note">Normalize updates · bound scores · restrict attention edges</text><rect x="30" y="125" width="190" height="65" rx="10" class="box"/><text x="125" y="152" text-anchor="middle" class="label">RMSNorm</text><text x="125" y="176" text-anchor="middle" class="small">attention input</text><rect x="275" y="125" width="240" height="65" rx="10" class="accent"/><text x="395" y="152" text-anchor="middle" class="label">Attention update</text><text x="395" y="176" text-anchor="middle" class="small">local or global</text><rect x="565" y="125" width="190" height="65" rx="10" class="box"/><text x="660" y="152" text-anchor="middle" class="label">RMSNorm</text><text x="660" y="176" text-anchor="middle" class="small">attention output</text><rect x="810" y="125" width="140" height="65" rx="10" class="box"/><text x="880" y="152" text-anchor="middle" class="label">+ residual</text><text x="880" y="176" text-anchor="middle" class="small">width 3,584</text><path d="M220 158H275" class="line "/><path d="M515 158H565" class="line "/><path d="M755 158H810" class="line "/><path d="M20 158H30" class="line"/><path d="M20 158V100H878V125" class="line dashed"/><rect x="30" y="250" width="190" height="65" rx="10" class="box"/><text x="125" y="277" text-anchor="middle" class="label">RMSNorm</text><text x="125" y="301" text-anchor="middle" class="small">FFN input</text><rect x="275" y="250" width="240" height="65" rx="10" class="purple"/><text x="395" y="277" text-anchor="middle" class="label">GELU-gated FFN</text><text x="395" y="301" text-anchor="middle" class="small">14,336 per branch</text><rect x="565" y="250" width="190" height="65" rx="10" class="box"/><text x="660" y="277" text-anchor="middle" class="label">RMSNorm</text><text x="660" y="301" text-anchor="middle" class="small">FFN output</text><rect x="810" y="250" width="140" height="65" rx="10" class="box"/><text x="880" y="277" text-anchor="middle" class="label">+ residual</text><text x="880" y="301" text-anchor="middle" class="small">width 3,584</text><path d="M220 283H275" class="line "/><path d="M515 283H565" class="line "/><path d="M755 283H810" class="line "/><path d="M20 283V225H878V250" class="line dashed"/><path d="M950 158H980V210H20V283H30" class="line"/><path d="M30 352H965" stroke="#c7d1d4"/><text x="35" y="383" class="label">Attention scores: keep the order</text><rect x="30" y="405" width="175" height="65" rx="10" class="box"/><text x="117.5" y="432" text-anchor="middle" class="label">Scaled QKᵀ</text><text x="117.5" y="456" text-anchor="middle" class="small">configured scale</text><rect x="247" y="405" width="210" height="65" rx="10" class="accent"/><text x="352" y="432" text-anchor="middle" class="label">50 tanh(z / 50)</text><text x="352" y="456" text-anchor="middle" class="small">finite soft cap</text><rect x="500" y="405" width="200" height="65" rx="10" class="box"/><text x="600" y="432" text-anchor="middle" class="label">Add mask</text><text x="600" y="456" text-anchor="middle" class="small">forbidden → −∞</text><rect x="742" y="405" width="208" height="65" rx="10" class="box"/><text x="846" y="432" text-anchor="middle" class="label">Softmax → V</text><text x="846" y="456" text-anchor="middle" class="small">weighted retrieval</text><path d="M205 438H247" class="line "/><path d="M457 438H500" class="line "/><path d="M700 438H742" class="line "/><text x="35" y="517" class="note">Repeat local window 4,096 / global context 8,192 · 42 layers in the 9B reference</text></svg>
