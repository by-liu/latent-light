<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc"><title id="title">Causal within a chunk, recurrent between chunks</title><desc id="desc">An incoming state carries earlier chunks. Current chunk queries and transformed keys/values form a causal lower-triangular parallel contribution. That contribution combines with a decayed state read for current outputs. A boundary update passes the new state to the next chunk. No future-token information is used.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334c68"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#152b43}.head{font-size:18px;font-weight:650}.body{font-size:16px}.small{font-size:14px;fill:#334c68}.title{font-size:26px;font-weight:700}.blue{fill:#edf4ff;stroke:#719acb;stroke-width:1.5}.teal{fill:#e9f6f2;stroke:#4a9b86;stroke-width:1.5}.gray{fill:#f3f5f8;stroke:#8193a5;stroke-width:1.5}.arrow{fill:none;stroke:#334c68;stroke-width:2}.feedback{fill:none;stroke:#334c68;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1040" height="500" rx="18" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start"><tspan x="30" dy="0">Causal within a chunk, recurrent between chunks</tspan></text><rect x="28" y="211" width="220" height="100" rx="12" class="gray"/><text x="46" y="239" class="head" text-anchor="start"><tspan x="46" dy="0">Incoming state</tspan></text><text x="46" y="264" class="body" text-anchor="start"><tspan x="46" dy="0">One matrix per head</tspan><tspan x="46" dy="23">History before this chunk</tspan></text><rect x="321" y="78" width="275" height="110" rx="12" class="blue"/><text x="339" y="106" class="head" text-anchor="start"><tspan x="339" dy="0">Current chunk</tspan></text><text x="339" y="131" class="body" text-anchor="start"><tspan x="339" dy="0">Queries, keys, values, decay</tspan><tspan x="339" dy="23">WY / UT corrective transform</tspan><tspan x="339" dy="23">Causal triangular interactions</tspan></text><rect x="321" y="303" width="275" height="100" rx="12" class="teal"/><text x="339" y="331" class="head" text-anchor="start"><tspan x="339" dy="0">State contribution</tspan></text><text x="339" y="356" class="body" text-anchor="start"><tspan x="339" dy="0">Read decayed incoming state</tspan><tspan x="339" dy="23">No earlier token reconstruction</tspan></text><rect x="737" y="176" width="267" height="108" rx="12" class="teal"/><text x="755" y="204" class="head" text-anchor="start"><tspan x="755" dy="0">Current outputs</tspan></text><text x="755" y="229" class="body" text-anchor="start"><tspan x="755" dy="0">State read + chunk contribution</tspan><tspan x="755" dy="23">Only positions up to each query</tspan></text><rect x="737" y="340" width="267" height="100" rx="12" class="gray"/><text x="755" y="368" class="head" text-anchor="start"><tspan x="755" dy="0">Boundary state</tspan></text><text x="755" y="393" class="body" text-anchor="start"><tspan x="755" dy="0">Apply this chunk’s updates</tspan><tspan x="755" dy="23">Carry into the next chunk</tspan></text><path d="M248 262 H280 V354 H321" class="arrow" marker-end="url(#arrow)"/><path d="M596 128 H865 V176" class="arrow" marker-end="url(#arrow)"/><path d="M596 350 H658 V246 H737" class="arrow" marker-end="url(#arrow)"/><path d="M248 288 H290 V461 H875 V440" class="arrow" marker-end="url(#arrow)"/><path d="M596 150 H683 V390 H737" class="arrow" marker-end="url(#arrow)"/><path d="M1004 392 H1023 V467 H140 V311" class="feedback" marker-end="url(#arrow)"/><text x="32" y="489" class="small" text-anchor="start"><tspan x="32" dy="0">Triangular computation is not softmax attention. The next chunk still depends on its incoming state.</tspan></text></svg>
