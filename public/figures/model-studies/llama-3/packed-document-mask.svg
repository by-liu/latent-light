<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 530" role="img" aria-labelledby="title desc"><title id="title">Packed document attention mask</title><desc id="desc">Two four-token documents A and B share a packed sequence. Allowed query-key pairs form two separate lower triangles: current and earlier keys from the same document only. B1 cannot read any A token.</desc><rect width="890" height="530" rx="18" fill="#faf9f5"/><g font-family="system-ui,sans-serif" fill="#20292d"><text x="40" y="46" font-size="25" font-weight="650">Pack documents. Keep attention separate.</text><text x="40" y="73" font-size="15" fill="#586569">Two independent rules: same document, then no future keys.</text><text x="280" y="91" font-size="13" text-anchor="middle">KEY POSITIONS →</text><text x="40" y="296" font-size="13" transform="rotate(-90 40 296)" text-anchor="middle">QUERY POSITIONS →</text><rect x="130" y="116" width="42" height="42" fill="#417c81"/><text x="151" y="142" fill="#ffffff" text-anchor="middle" font-size="15">✓</text><rect x="174" y="116" width="42" height="42" fill="#e8e8e4"/><text x="195" y="142" fill="#858a8b" text-anchor="middle" font-size="15">·</text><rect x="218" y="116" width="42" height="42" fill="#e8e8e4"/><text x="239" y="142" fill="#858a8b" text-anchor="middle" font-size="15">·</text><rect x="262" y="116" width="42" height="42" fill="#e8e8e4"/><text x="283" y="142" fill="#858a8b" text-anchor="middle" font-size="15">·</text><rect x="306" y="116" width="42" height="42" fill="#e8e8e4"/><text x="327" y="142" fill="#858a8b" text-anchor="middle" font-size="15">·</text><rect x="350" y="116" width="42" height="42" fill="#e8e8e4"/><text x="371" y="142" fill="#858a8b" text-anchor="middle" font-size="15">·</text><rect x="394" y="116" width="42" height="42" fill="#e8e8e4"/><text x="415" y="142" fill="#858a8b" text-anchor="middle" font-size="15">·</text><rect x="438" y="116" width="42" height="42" fill="#e8e8e4"/><text x="459" y="142" fill="#858a8b" text-anchor="mi