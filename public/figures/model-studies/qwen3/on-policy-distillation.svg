<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="485" viewBox="0 0 1040 485" role="img" aria-labelledby="title desc"><title id="title">The student owns the trajectory</title><desc id="desc">A prompt and student-generated prefix go to both frozen teacher and trainable student. The student samples the next token, extending its own prefix. Teacher and student distributions on that same prefix enter a KL matching loss. Only the student is updated. The report does not specify the KL direction.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334c68"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#152b43}.head{font-size:18px;font-weight:650}.body{font-size:16px}.small{font-size:14px;fill:#334c68}.title{font-size:26px;font-weight:700}.blue{fill:#edf4ff;stroke:#719acb;stroke-width:1.5}.teal{fill:#e9f6f2;stroke:#4a9b86;stroke-width:1.5}.gray{fill:#f3f5f8;stroke:#8193a5;stroke-width:1.5}.arrow{fill:none;stroke:#334c68;stroke-width:2}.feedback{fill:none;stroke:#334c68;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1040" height="485" rx="18" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start"><tspan x="30" dy="0">The student owns the trajectory</tspan></text><rect x="35" y="193" width="230" height="105" rx="12" class="gray"/><text x="53" y="221" class="head" text-anchor="start"><tspan x="53" dy="0">Shared context</tspan></text><text x="53" y="246" class="body" text-anchor="start"><tspan x="53" dy="0">Prompt + mode flag</tspan><tspan x="53" dy="23">Student generated prefix</tspan></text><rect x="337" y="87" width="245" height="108" rx="12" class="blue"/><text x="355" y="115" class="head" text-anchor="start"><tspan x="355" dy="0">Teacher</tspan></text><text x="355" y="140" class="body" text-anchor="start"><tspan x="355" dy="0">Scores the same prefix</tspan><tspan x="355" dy="23">Provides token distribution</tspan><tspan x="355" dy="23">No student gradient</tspan></text><rect x="337" y="299" width="245" height="108" rx="12" class="teal"/><text x="355" y="327" class="head" text-anchor="start"><tspan x="355" dy="0">Student</tspan></text><text x="355" y="352" class="body" text-anchor="start"><tspan x="355" dy="0">Scores the same prefix</tspan><tspan x="355" dy="23">Samples the next token</tspan><tspan x="355" dy="23">Receives the update</tspan></text><rect x="701" y="200" width="300" height="105" rx="12" class="gray"/><text x="719" y="228" class="head" text-anchor="start"><tspan x="719" dy="0">Distribution matching</tspan></text><text x="719" y="253" class="body" text-anchor="start"><tspan x="719" dy="0">KL objective on visited states</tspan><tspan x="719" dy="23">Direction not specified in report</tspan></text><path d="M265 220 H300 V139 H337" class="arrow" marker-end="url(#arrow)"/><path d="M265 272 H300 V355 H337" class="arrow" marker-end="url(#arrow)"/><path d="M582 140 H850 V200" class="arrow" marker-end="url(#arrow)"/><path d="M582 354 H850 V305" class="arrow" marker-end="url(#arrow)"/><path d="M701 278 H665 V435 H460 V407" class="arrow" marker-end="url(#arrow)"/><text x="690" y="427" class="small" text-anchor="start"><tspan x="690" dy="0">Update student only</tspan></text><path d="M337 381 H290 V435 H150 V298" class="feedback" marker-end="url(#arrow)"/><text x="34" y="427" class="small" text-anchor="start"><tspan x="34" dy="0">Extend student prefix</tspan></text></svg>
