<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc"><title id="title">Selection control is not mixture weighting</title><desc id="desc">Token affinities split into biased selection and unbiased weights. Node eligible selection chooses routed experts. Shared experts bypass routing. The weighted routed output combines with the shared output. Batch statistics adjust only the bias used next step.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334c68"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#152b43}.head{font-size:18px;font-weight:650}.body{font-size:16px}.small{font-size:14px;fill:#334c68}.title{font-size:26px;font-weight:700}.blue{fill:#edf4ff;stroke:#719acb;stroke-width:1.5}.teal{fill:#e9f6f2;stroke:#4a9b86;stroke-width:1.5}.gray{fill:#f3f5f8;stroke:#8193a5;stroke-width:1.5}.arrow{fill:none;stroke:#334c68;stroke-width:2}.feedback{fill:none;stroke:#334c68;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1040" height="570" rx="18" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start"><tspan x="30" dy="0">Selection control is not mixture weighting</tspan></text><rect x="35" y="211" width="195" height="95" rx="12" class="blue"/><text x="53" y="239" class="head" text-anchor="start"><tspan x="53" dy="0">Token affinities</tspan></text><text x="53" y="264" class="body" text-anchor="start"><tspan x="53" dy="0">Sigmoid router scores</tspan><tspan x="53" dy="23">Keep original scores</tspan></text><rect x="290" y="93" width="250" height="118" rx="12" class="blue"/><text x="308" y="121" class="head" text-anchor="start"><tspan x="308" dy="0">Selection path</tspan></text><text x="308" y="146" class="body" text-anchor="start"><tspan x="308" dy="0">Add expert bias</tspan><tspan x="308" dy="23">Keep eligible node groups</tspan><tspan x="308" dy="23">Choose eight expert IDs</tspan></text><rect x="290" y="302" width="250" height="118" rx="12" class="teal"/><text x="308" y="330" class="head" text-anchor="start"><tspan x="308" dy="0">Weight path</tspan></text><text x="308" y="355" class="body" text-anchor="start"><tspan x="308" dy="0">Gather original affinities</tspan><tspan x="308" dy="23">for selected expert IDs</tspan><tspan x="308" dy="23">Normalize, then scale</tspan></text><rect x="604" y="125" width="180" height="95" rx="12" class="blue"/><text x="622" y="153" class="head" text-anchor="start"><tspan x="622" dy="0">Selected experts</tspan></text><text x="622" y="178" class="body" text-anchor="start"><tspan x="622" dy="0">Dispatch token</tspan><tspan x="622" dy="23">Expert outputs</tspan></text><rect x="834" y="251" width="180" height="95" rx="12" class="teal"/><text x="852" y="279" class="head" text-anchor="start"><tspan x="852" dy="0">Combine</tspan></text><text x="852" y="304" class="body" text-anchor="start"><tspan x="852" dy="0">Weighted routed sum</tspan><tspan x="852" dy="23">plus shared output</tspan></text><rect x="604" y="406" width="180" height="95" rx="12" class="gray"/><text x="622" y="434" class="head" text-anchor="start"><tspan x="622" dy="0">Shared expert</tspan></text><text x="622" y="459" class="body" text-anchor="start"><tspan x="622" dy="0">Always evaluated</tspan><tspan x="622" dy="23">No top k selection</tspan></text><rect x="290" y="475" width="250" height="70" rx="12" class="gray"/><text x="308" y="503" class="head" text-anchor="start"><tspan x="308" dy="0">Batch load statistics</tspan></text><text x="308" y="528" class="body" text-anchor="start"><tspan x="308" dy="0">Adjust next selection bias</tspan></text><path d="M230 240 H257 V150 H290" class="arrow" marker-end="url(#arrow)"/><path d="M230 265 H257 V360 H290" class="arrow" marker-end="url(#arrow)"/><path d="M540 150 H604" class="arrow" marker-end="url(#arrow)"/><path d="M415 211 V302" class="arrow" marker-end="url(#arrow)"/><text x="425" y="260" class="small" text-anchor="start"><tspan x="425" dy="0">Expert IDs</tspan></text><path d="M784 172 H805 V278 H834" class="arrow" marker-end="url(#arrow)"/><path d="M540 361 H805 V310 H834" class="arrow" marker-end="url(#arrow)"/><path d="M784 451 H924 V346" class="arrow" marker-end="url(#arrow)"/><path d="M665 220 V265 H560 V510 H540" class="arrow" marker-end="url(#arrow)"/><path d="M290 508 H269 V123 H290" class="feedback" marker-end="url(#arrow)"/><text x="45" y="485" class="small" text-anchor="start"><tspan x="45" dy="0">Next batch</tspan></text></svg>
