<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc"><title id="title">Sample, compare, then update</title><desc id="desc">The old policy samples a group. Rewards produce normalized advantages. The current policy scores the sampled responses to form the current versus old ratio. A separate reference policy supplies the KL anchor. These terms update the current policy; the next iteration refreshes the old policy.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334c68"/></marker></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#152b43}.head{font-size:18px;font-weight:650}.body{font-size:16px}.small{font-size:14px;fill:#334c68}.title{font-size:26px;font-weight:700}.blue{fill:#edf4ff;stroke:#719acb;stroke-width:1.5}.teal{fill:#e9f6f2;stroke:#4a9b86;stroke-width:1.5}.gray{fill:#f3f5f8;stroke:#8193a5;stroke-width:1.5}.arrow{fill:none;stroke:#334c68;stroke-width:2}.feedback{fill:none;stroke:#334c68;stroke-width:2;stroke-dasharray:7 5}</style><rect width="1040" height="480" rx="18" fill="#fff"/><text x="30" y="43" class="title" text-anchor="start"><tspan x="30" dy="0">Sample, compare, then update</tspan></text><rect x="30" y="97" width="230" height="98" rx="12" class="blue"/><text x="48" y="125" class="head" text-anchor="start"><tspan x="48" dy="0">Old policy</tspan></text><text x="48" y="150" class="body" text-anchor="start"><tspan x="48" dy="0">Sample G responses</tspan><tspan x="48" dy="23">Record their probabilities</tspan></text><rect x="310" y="97" width="235" height="98" rx="12" class="teal"/><text x="328" y="125" class="head" text-anchor="start"><tspan x="328" dy="0">Reward computation</tspan></text><text x="328" y="150" class="body" text-anchor="start"><tspan x="328" dy="0">Verifier or preference model</tspan><tspan x="328" dy="23">Normalize within the group</tspan></text><rect x="30" y="265" width="230" height="98" rx="12" class="blue"/><text x="48" y="293" class="head" text-anchor="start"><tspan x="48" dy="0">Current policy</tspan></text><text x="48" y="318" class="body" text-anchor="start"><tspan x="48" dy="0">Score the same responses</tspan><tspan x="48" dy="23">Parameters receive gradients</tspan></text><rect x="310" y="265" width="235" height="98" rx="12" class="gray"/><text x="328" y="293" class="head" text-anchor="start"><tspan x="328" dy="0">Reference policy</tspan></text><text x="328" y="318" class="body" text-anchor="start"><tspan x="328" dy="0">Score the same responses</tspan><tspan x="328" dy="23">Supplies the KL anchor</tspan></text><rect x="690" y="197" width="300" height="130" rx="12" class="teal"/><text x="708" y="225" class="head" text-anchor="start"><tspan x="708" dy="0">Policy objective</tspan></text><text x="708" y="250" class="body" text-anchor="start"><tspan x="708" dy="0">Current / old probability ratio</tspan><tspan x="708" dy="23">Clipped advantage contribution</tspan><tspan x="708" dy="23">Separate reference KL penalty</tspan></text><path d="M260 145 H310" class="arrow" marker-end="url(#arrow)"/><path d="M545 145 H838 V197" class="arrow" marker-end="url(#arrow)"/><path d="M260 174 H283 V227 H690" class="arrow" marker-end="url(#arrow)"/><text x="320" y="217" class="small" text-anchor="start"><tspan x="320" dy="0">Old probabilities</tspan></text><path d="M260 310 H280 V255 H690" class="arrow" marker-end="url(#arrow)"/><text x="323" y="246" class="small" text-anchor="start"><tspan x="323" dy="0">Current probabilities</tspan></text><path d="M545 313 H690" class="arrow" marker-end="url(#arrow)"/><text x="552" y="301" class="small" text-anchor="start"><tspan x="552" dy="0">Reference KL</tspan></text><path d="M841 327 V413 H145 V363" class="arrow" marker-end="url(#arrow)"/><text x="363" y="404" class="small" text-anchor="start"><tspan x="363" dy="0">Gradient update</tspan></text><path d="M30 303 H15 V145 H30" class="feedback" marker-end="url(#arrow)"/><text x="30" y="453" class="small" text-anchor="start"><tspan x="30" dy="0">Next sampling iteration refreshes the old policy; reward computation is not the omitted critic baseline.</tspan></text></svg>
