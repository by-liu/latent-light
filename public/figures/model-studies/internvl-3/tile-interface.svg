<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">InternVL3: local tiles plus a global view</title><desc id="desc">For an 896 by 896 image, a 2 by 2 grid produces four 448 by 448 local tiles. One global thumbnail makes five views. Each view produces 1024 patch features, reduced from a 32 by 32 grid to a 16 by 16 grid by spatial unshuffle. An MLP maps 256 features per view into 3584-dimensional language vectors. Five views therefore produce 1280 visual positions plus two boundary positions.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c3b} .title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#466271}.tiny{font-size:13px;fill:#466271}.line{stroke:#496a7b;stroke-width:2;fill:none}.box{fill:#f5f9fc;stroke:#c7d8e2;stroke-width:1.5}.violet{fill:#ede7fb;stroke:#8976bd}.teal{fill:#e3f3f0;stroke:#499a91}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#496a7b"/></marker><pattern id="tilegrid" width="3.5" height="3.5" patternUnits="userSpaceOnUse"><path d="M3.5 0H0V3.5" fill="none" stroke="#7ca0b6" stroke-width=".5"/></pattern></defs><rect width="900" height="520" rx="20" fill="#fff"/><text x="28" y="39" class="title">Keep local detail and a global view</text><text x="28" y="65" class="note">InternVL3-8B · worked 896 × 896 image · selected preprocessing example</text><rect x="28" y="89" width="312" height="235" rx="12" class="box"/><text x="44" y="118" class="head">Four 448 × 448 crops</text><g stroke="#6491a9"><rect x="45" y="139" width="75" height="75" fill="#e0edf4"/><rect x="124" y="139" width="75" height="75" fill="#c9dfed"/><rect x="45" y="218" width="75" height="75" fill="#b5d1e3"/><rect x="124" y="218" width="75" height="75" fill="#9ec3da"/></g><g class="head"><text x="75" y="181">1</text><text x="154" y="181">2</text><text x="75" y="260">3</text><text x="154" y="260">4</text></g><text x="214" y="181" class="head">+</text><rect x="240" y="153" width="74" height="74" rx="5" class="violet"/><path d="M277 153V227M240 190H314" stroke="#aa95c5"/><text x="237" y="251" class="note">Thumbnail</text><text x="232" y="277" class="note">Global view</text><path d="M340 207H367" class="line" marker-end="url(#arrow)"/><rect x="385" y="89" width="245" height="235" rx="12" class="box"/><text x="400" y="118" class="head">Shared vision encoder</text><rect x="431" y="137" width="112" height="112" fill="url(#tilegrid)" stroke="#6590a9"/><text x="400" y="276" class="body">32 × 32 patch features</text><text x="400" y="301" class="note">1,024 features per view</text><path d="M630 207H656" class="line" marker-end="url(#arrow)"/><rect x="674" y="89" width="198" height="235" rx="12" class="teal"/><text x="690" y="118" class="head">Spatial unshuffle</text><text x="690" y="150" class="body">32 × 32 × 1,024</text><path d="M756 162V185" class="line" marker-end="url(#arrow)"/><text x="690" y="216" class="body">16 × 16 × 4,096</text><text x="690" y="251" class="note">LayerNorm + GELU MLP</text><text x="690" y="285" class="head">256 × 3,584</text><text x="690" y="309" class="note">language vectors per view</text><path d="M775 324V343H450V358" class="line" marker-end="url(#arrow)"/><rect x="28" y="371" width="844" height="105" rx="12" class="box"/><text x="44" y="400" class="head">Decoder visual span: 5 views × 256 = 1,280 positions</text><rect x="44" y="416" width="44" height="38" rx="5" class="violet"/><text x="55" y="442" class="body">〈</text><g stroke="#6491a9"><rect x="95" y="416" width="136" height="38" fill="#e0edf4"/><rect x="231" y="416" width="136" height="38" fill="#c9dfed"/><rect x="367" y="416" width="136" height="38" fill="#b5d1e3"/><rect x="503" y="416" width="136" height="38" fill="#9ec3da"/><rect x="639" y="416" width="136" height="38" fill="#e9def6"/></g><text x="128" y="442" class="body">Tile 1</text><text x="264" y="442" class="body">Tile 2</text><text x="400" y="442" class="body">Tile 3</text><text x="536" y="442" class="body">Tile 4</text><text x="651" y="442" class="body">Thumbnail</text><rect x="785" y="416" width="44" height="38" rx="5" class="violet"/><text x="796" y="442" class="body">〉</text><text x="28" y="503" class="note">All five views share the encoder and connector. Two boundary positions are additional; text comes beside them.</text></svg>
