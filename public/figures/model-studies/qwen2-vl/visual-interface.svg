<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">Qwen2-VL: two different sequence budgets</title><desc id="desc">A 448 by 672 processed image makes a 32 by 48 grid, or 1536 vision positions. A normalized group of four 1280-dimensional contextual features is concatenated to width 5120, then an MLP maps it to one 3584-dimensional language vector. All groups yield384 visual positions plus two boundary positions. Text and multimodal coordinates enter the causal decoder beside those vectors.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c3b} .title{font-size:25px;font-weight:700}.head{font-size:19px;font-weight:700}.body{font-size:17px}.note{font-size:15px;fill:#466271}.tiny{font-size:13px;fill:#466271}.line{stroke:#496a7b;stroke-width:2;fill:none}.box{fill:#f5f9fc;stroke:#c7d8e2;stroke-width:1.5}.violet{fill:#ede7fb;stroke:#8976bd}.teal{fill:#e3f3f0;stroke:#499a91}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#496a7b"/></marker><pattern id="patches" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M4 0H0V4" fill="none" stroke="#7ca0b6" stroke-width=".55"/></pattern></defs><rect width="900" height="540" rx="20" fill="#fff"/><text x="28" y="39" class="title">Two sequence budgets, one visual input</text><text x="28" y="66" class="note">Qwen2-VL-7B-Instruct · worked still-image example</text><rect x="28" y="90" width="230" height="212" rx="12" class="box"/><text x="44" y="119" class="head">Vision encoder grid</text><rect x="46" y="136" width="192" height="128" fill="url(#patches)" stroke="#5f879e"/><rect x="46" y="136" width="8" height="8" fill="#d0bcef" stroke="#76599c"/><text x="44" y="288" class="body">32 × 48 = 1,536 positions</text><path d="M258 193H289" class="line" marker-end="url(#arrow)"/><rect x="304" y="90" width="240" height="212" rx="12" class="box"/><text x="320" y="119" class="head">Zoom: 2 × 2 neighbors</text><g stroke="#8670ad"><rect x="339" y="138" width="62" height="53" rx="5" fill="#e8ddf6"/><rect x="407" y="138" width="62" height="53" rx="5" fill="#ddd0ed"/><rect x="339" y="197" width="62" height="53" rx="5" fill="#d3c2e8"/><rect x="407" y="197" width="62" height="53" rx="5" fill="#c9b5e4"/></g><text x="364" y="171" class="body">a</text><text x="431" y="171" class="body">b</text><text x="364" y="230" class="body">c</text><text x="431" y="230" class="body">d</text><text x="320" y="288" class="body">4 features × width 1,280</text><path d="M544 193H578" class="line" marker-end="url(#arrow)"/><rect x="594" y="90" width="278" height="212" rx="12" class="teal"/><text x="610" y="119" class="head">Learned spatial merger</text><text x="610" y="152" class="note">Normalize each feature, then join</text><g stroke="#8670ad"><rect x="620" y="169" width="52" height="38" fill="#e8ddf6"/><rect x="672" y="169" width="52" height="38" fill="#ddd0ed"/><rect x="724" y="169" width="52" height="38" fill="#d3c2e8"/><rect x="776" y="169" width="52" height="38" fill="#c9b5e4"/></g><text x="625" y="195" class="body">a</text><text x="677" y="195" class="body">b</text><text x="729" y="195" class="body">c</text><text x="781" y="195" class="body">d</text><text x="610" y="239" class="body">5,120 → MLP → 3,584</text><text x="610" y="274" class="head">One language vector</text><path d="M737 302V321H424V339" class="line" marker-end="url(#arrow)"/><rect x="28" y="352" width="844" height="124" rx="12" class="box"/><text x="44" y="381" class="head">Shared causal language sequence</text><rect x="44" y="397" width="97" height="42" rx="6" fill="#e1eaf4"/><text x="62" y="424" class="body">Text</text><rect x="147" y="397" width="44" height="42" rx="4" class="violet"/><text x="158" y="424" class="body">〈</text><rect x="197" y="397" width="356" height="42" rx="6" class="teal"/><text x="220" y="424" class="head">384 merged visual positions</text><rect x="559" y="397" width="44" height="42" rx="4" class="violet"/><text x="570" y="424" class="body">〉</text><rect x="609" y="397" width="237" height="42" rx="6" fill="#e1eaf4"/><text x="625" y="424" class="body">Text → generated answer</text><text x="44" y="462" class="note">Visual span: 384 + 2 markers. M-RoPE adds coordinates, not extra tokens.</text><text x="28" y="509" class="note">Image: 448 × 672 pixels · patches: 14 × 14 · still image duplicated for the temporal kernel</text></svg>
