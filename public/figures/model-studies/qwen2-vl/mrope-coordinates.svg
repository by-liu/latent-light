<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc"><title id="title">Qwen2-VL: geometry is not sequence length</title><desc id="desc">Toy merged grid with two rows and three columns; the first visual coordinate starts at five. Six visual sequence slots use temporal coordinate five and row and column coordinates five to seven. The image end marker at sequence slot eleven resumes coordinate eight; following text at slot twelve uses coordinate nine. Video time advances per temporal tube, not per second.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c3b}.title{font-size:26px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:18px}.note{font-size:16px;fill:#466271}.small{font-size:14px;fill:#466271}.coord{font-size:18px;font-family:monospace}.box{fill:#f5f9fc;stroke:#c7d8e2;stroke-width:1.5}.purple{fill:#ede7fb;stroke:#8976bd;stroke-width:1.5}.teal{fill:#e3f3f0;stroke:#499a91;stroke-width:1.5}.line{fill:none;stroke:#496a7b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#496a7b"/></marker><pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0V6" fill="none" stroke="#7ca0b6" stroke-width=".65"/></pattern></defs><rect width="920" height="620" rx="20" fill="#fff"/>
<text x="28" y="40" class="title">Geometry is not sequence length</text><text x="28" y="68" class="note">Qwen2-VL · toy 2 × 3 merged grid · visual coordinate base = 5</text>
<rect x="28" y="92" width="556" height="259" rx="12" class="box"/><text x="44" y="124" class="head">Six visual vectors: (time, height, width)</text><rect x="60" y="139" width="151" height="78" rx="8" class="purple"/><text x="72" y="167" class="small">Sequence slot 5</text><text x="74" y="195" class="coord">(5,5,5)</text><rect x="225" y="139" width="151" height="78" rx="8" class="purple"/><text x="237" y="167" class="small">Sequence slot 6</text><text x="239" y="195" class="coord">(5,5,6)</text><rect x="390" y="139" width="151" height="78" rx="8" class="purple"/><text x="402" y="167" class="small">Sequence slot 7</text><text x="404" y="195" class="coord">(5,5,7)</text><rect x="60" y="231" width="151" height="78" rx="8" class="teal"/><text x="72" y="259" class="small">Sequence slot 8</text><text x="74" y="287" class="coord">(5,6,5)</text><rect x="225" y="231" width="151" height="78" rx="8" class="teal"/><text x="237" y="259" class="small">Sequence slot 9</text><text x="239" y="287" class="coord">(5,6,6)</text><rect x="390" y="231" width="151" height="78" rx="8" class="teal"/><text x="402" y="259" class="small">Sequence slot 10</text><text x="404" y="287" class="coord">(5,6,7)</text>
<rect x="617" y="92" width="275" height="259" rx="12" class="box"/><text x="633" y="124" class="head">Then resume text order</text><rect x="633" y="145" width="243" height="82" rx="8" class="purple"/><text x="649" y="173" class="small">Image end · sequence slot 11</text><text x="649" y="206" class="coord">(8,8,8)</text><rect x="633" y="242" width="243" height="82" rx="8" class="teal"/><text x="649" y="270" class="small">Next text · sequence slot 12</text><text x="649" y="303" class="coord">(9,9,9)</text><path d="M584 208H609" class="line" marker-end="url(#arrow)"/>
<rect x="28" y="381" width="864" height="138" rx="12" class="box"/><text x="44" y="413" class="head">A video repeats the spatial grid across temporal tubes</text><rect x="44" y="433" width="268" height="60" rx="8" class="purple"/><text x="60" y="458" class="body">Tube 0: time coordinate 5</text><text x="60" y="480" class="small">Six visual sequence positions</text><path d="M312 463H350" class="line" marker-end="url(#arrow)"/><rect x="365" y="433" width="268" height="60" rx="8" class="teal"/><text x="381" y="458" class="body">Tube 1: time coordinate 6</text><text x="381" y="480" class="small">Six more sequence positions</text><text x="657" y="456" class="head">12 vectors total</text><text x="657" y="482" class="note">No cache entries removed</text>
<text x="28" y="559" class="note">Tube indices are ordinal positions, not elapsed seconds or timestamp tokens.</text><text x="28" y="586" class="note">Rotary coordinates change attention queries and keys. They do not change token count.</text></svg>
