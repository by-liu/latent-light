<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc"><title id="title">LLaVA-1.5-HD: local detail plus global context</title><desc id="desc">A separate HD example, not the released fixed 336 pixel checkpoint. A 448 by 448 image gives four 224 pixel local views. Each view yields 16 by 16 features. Reassembly makes 32 by 32 features with 32 row separators. A global 224 pixel view contributes 256 features. In this no-padding example the language model receives 1312 visual positions.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#172c3b}.title{font-size:26px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:18px}.note{font-size:16px;fill:#466271}.small{font-size:14px;fill:#466271}.coord{font-size:18px;font-family:monospace}.box{fill:#f5f9fc;stroke:#c7d8e2;stroke-width:1.5}.purple{fill:#ede7fb;stroke:#8976bd;stroke-width:1.5}.teal{fill:#e3f3f0;stroke:#499a91;stroke-width:1.5}.line{fill:none;stroke:#496a7b;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#496a7b"/></marker><pattern id="grid" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0V6" fill="none" stroke="#7ca0b6" stroke-width=".65"/></pattern><pattern id="local-grid" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M5 0H0V5" fill="none" stroke="#7ca0b6" stroke-width=".65"/></pattern><pattern id="global-grid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" stroke="#7ca0b6" stroke-width=".65"/></pattern></defs><rect width="920" height="620" rx="20" fill="#fff"/>
<text x="28" y="40" class="title">Local detail + global context</text><text x="28" y="68" class="note">Separate LLaVA-1.5-HD extension · worked example with no padding</text>
<rect x="28" y="94" width="238" height="252" rx="12" class="box"/><text x="44" y="125" class="head">Four local views</text>
<g stroke="#6f879d" stroke-width="1.5"><rect x="64" y="146" width="78" height="78" fill="#e8ddf6"/><rect x="146" y="146" width="78" height="78" fill="#d4e6f2"/><rect x="64" y="228" width="78" height="78" fill="#d8ece5"/><rect x="146" y="228" width="78" height="78" fill="#f2e5d2"/></g><text x="96" y="190" class="body">A</text><text x="177" y="190" class="body">B</text><text x="96" y="273" class="body">C</text><text x="177" y="273" class="body">D</text><text x="45" y="329" class="note">448 × 448 → 4 × 224² views</text>
<path d="M266 220H301" class="line" marker-end="url(#arrow)"/>
<rect x="316" y="94" width="278" height="252" rx="12" class="box"/><text x="332" y="125" class="head">Encode + reassemble</text>
<rect x="370" y="145" width="160" height="160" fill="url(#local-grid)" stroke="#5f879e"/><path d="M450 145V305M370 225H530" stroke="#507189" stroke-width="2"/><rect x="535" y="145" width="15" height="160" class="purple"/><path d="M535 150H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 155H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 160H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 165H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 170H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 175H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 180H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 185H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 190H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 195H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 200H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 205H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 210H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 215H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 220H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 225H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 230H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 235H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 240H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 245H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 250H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 255H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 260H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 265H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 270H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 275H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 280H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 285H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 290H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 295H550" stroke="#8976bd" stroke-width=".7"/><path d="M535 300H550" stroke="#8976bd" stroke-width=".7"/><text x="392" y="193" class="body">A</text><text x="465" y="193" class="body">B</text><text x="392" y="268" class="body">C</text><text x="465" y="268" class="body">D</text><text x="332" y="329" class="note">1,024 features + 32 row ends</text>
<rect x="632" y="94" width="260" height="252" rx="12" class="teal"/><text x="648" y="125" class="head">One global view</text><rect x="690" y="149" width="128" height="128" fill="url(#global-grid)" stroke="#499a91"/><text x="703" y="204" class="body">Whole image</text><text x="719" y="231" class="note">224 × 224</text><text x="648" y="306" class="body">16 × 16 = 256 features</text><text x="648" y="329" class="note">Preserves whole image context</text>
<path d="M455 346V367H584V390M762 346V367H584" class="line"/><path d="M584 377V399" class="line" marker-end="url(#arrow)"/>
<rect x="28" y="412" width="864" height="116" rx="12" class="box"/><text x="44" y="443" class="head">Flatten and concatenate for the language model</text><rect x="44" y="460" width="420" height="46" rx="6" class="purple"/><text x="61" y="490" class="body">1,024 local + 32 separators</text><text x="479" y="491" class="head">+</text><rect x="510" y="460" width="352" height="46" rx="6" class="teal"/><text x="531" y="490" class="body">256 global = 1,312 positions</text>
<text x="28" y="565" class="note">Each 224² view: native CLIP positions → 16 × 16 patch features → projector</text><text x="28" y="591" class="note">Padding-only features are removed when present. Text and wrapper markers are excluded here.</text></svg>
